# Koh Samui — Spire ingest elk uur (zelfde contract-merge als lib/spire.ts → Supabase).
# Lange horizon: time_bundle 6_hourly_15day @ 360h (+ 3h/1h); zie .cursor/skills/samui-concierge/SKILL.md
#
# Vereiste repository secrets (Settings -> Secrets and variables -> Actions):
#   SPIRE_API_TOKEN  (of SPIRE_API_KEY als fallback)
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY  (of SUPABASE_KEY als fallback)
# Optioneel — repository *variables* (Settings -> Secrets and variables -> Actions -> Variables):
#   WEATHER_LOCATION_ID, SAMUI_LAT, SAMUI_LON
#   SPIRE_FORECAST_BUNDLES, SPIRE_FORECAST_PRODUCT, SPIRE_FORECAST_UNIT_SYSTEM
#   SPIRE_OPF_LOCATION, SPIRE_OPF_BUNDLES, SPIRE_OPF_FORECAST_HOURS, SPIRE_OPF_ENABLED (=0 schakelt OPF uit)
#
# Handmatig testen: Actions -> Weather hourly ingest -> Run workflow

name: Weather hourly ingest

on:
  schedule:
    # Elke uur op :00 UTC (GitHub gebruikt UTC)
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: weather-hourly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # If this step is missing in the Actions log, you are not running this workflow file from GitHub.
      - name: Entrypoint check
        run: |
          echo "Samui hourly ingest - weather_engine_hourly.py (fog fix on main: 37a3570+)"
          test -f weather_engine_hourly.py
          echo "OK: weather_engine_hourly.py is in the repo checkout."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-weather-engine.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-weather-engine.txt

      # Entrypoint: weather_engine_hourly.py (Spire + RainViewer + Supabase upsert).
      - name: Run weather engine
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          SPIRE_API_TOKEN: ${{ secrets.SPIRE_API_TOKEN || secrets.SPIRE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          WEATHER_LOCATION_ID: ${{ vars.WEATHER_LOCATION_ID }}
          SAMUI_LAT: ${{ vars.SAMUI_LAT }}
          SAMUI_LON: ${{ vars.SAMUI_LON }}
          SPIRE_FORECAST_BUNDLES: ${{ vars.SPIRE_FORECAST_BUNDLES }}
          SPIRE_FORECAST_PRODUCT: ${{ vars.SPIRE_FORECAST_PRODUCT }}
          SPIRE_FORECAST_UNIT_SYSTEM: ${{ vars.SPIRE_FORECAST_UNIT_SYSTEM }}
          SPIRE_OPF_LOCATION: ${{ vars.SPIRE_OPF_LOCATION }}
          SPIRE_OPF_BUNDLES: ${{ vars.SPIRE_OPF_BUNDLES }}
          SPIRE_OPF_FORECAST_HOURS: ${{ vars.SPIRE_OPF_FORECAST_HOURS }}
          SPIRE_OPF_ENABLED: ${{ vars.SPIRE_OPF_ENABLED }}
        run: |
          set -euo pipefail
          echo "CI_GIT_SHA=$(git rev-parse HEAD)"
          if [ ! -f weather_engine_hourly.py ]; then
            echo "::error::weather_engine_hourly.py not in repo root — push the latest workflow and script from main."
            ls -la
            exit 1
          fi
          if [ -z "${SPIRE_API_TOKEN:-}" ]; then
            echo "::error::SPIRE_API_TOKEN is empty. Add repository secret SPIRE_API_TOKEN or SPIRE_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is empty. Add SUPABASE_SERVICE_ROLE_KEY or SUPABASE_KEY."
            exit 1
          fi
          python weather_engine_hourly.py
