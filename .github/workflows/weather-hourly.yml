# Koh Samui — hybrid Spire ingest elk uur (OPF + clouds/thunderstorm → Supabase).
# Vereiste repository secrets:
#   SPIRE_API_TOKEN
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
# Optioneel in workflow env (of laat Python-defaults): WEATHER_LOCATION_ID, FORECAST_HOURS

name: Weather hourly ingest

on:
  schedule:
    # Elke uur op :00 UTC (GitHub gebruikt UTC)
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: weather-hourly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-weather-engine.txt

      - name: Install dependencies
        run: pip install -r requirements-weather-engine.txt

      - name: Run weather engine
        env:
          SPIRE_API_TOKEN: ${{ secrets.SPIRE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python weather_engine_hourly.py
